<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <title>Shall We?! 8 Key Words - CRVGAMES</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    header {
      text-align: center;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 2rem;
      color: #38bdf8;
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    p.subtitle {
      color: #94a3b8;
      font-size: 0.95rem;
    }
    .score-board {
      background: #1e293b;
      padding: 10px 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      border: 1px solid #334155;
      font-weight: bold;
      color: #f1f5f9;
    }
    .game-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      width: 100%;
      max-width: 650px;
    }
    .card {
      background: #1e293b;
      border: 2px solid #334155;
      border-radius: 10px;
      padding: 15px;
      text-align: center;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card:hover {
      border-color: #38bdf8;
      transform: translateY(-2px);
    }
    .card.selected {
      border-color: #f59e0b;
      background: #334155;
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.4);
    }
    .card.matched {
      background: #065f46;
      border-color: #10b981;
      color: #a7f3d0;
      cursor: default;
      transform: none;
    }
    .win-msg {
      display: none;
      text-align: center;
      margin-top: 20px;
    }
    .win-msg button {
      background: #0284c7;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 1rem;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
    }
    .win-msg button:hover {
      background: #0369a1;
    }
  </style>
</head>
<body>

  <header>
    <h1>Shall We?!</h1>
    <p class="subtitle">Unit 8 - Key Words Matching Game</p>
  </header>

  <div class="score-board">
    Skor: <span id="score">0</span> / 8
  </div>

  <div class="game-container" id="game-board"></div>

  <div class="win-msg" id="win-message">
    <h2>Tebrikler! Hepsini Eşleştirdin! 🎉</h2>
    <button onclick="initGame()">Yeniden Oyna</button>
  </div>

  <script>
    const vocabulary = [
      { en: "Accept", tr: "Kabul Etmek" },
      { en: "Refuse", tr: "Reddetmek" },
      { en: "Offer", tr: "Teklif Etmek" },
      { en: "Invite", tr: "Davet Etmek" },
      { en: "Apologize", tr: "Özür Dilemek" },
      { en: "Suggestion", tr: "Öneri" },
      { en: "Attend", tr: "Katılmak" },
      { en: "Event", tr: "Etkinlik" }
    ];

    let selectedEnglish = null;
    let selectedTurkish = null;
    let score = 0;

    function shuffle(array) {
      return array.sort(() => Math.random() - 0.5);
    }

    function initGame() {
      score = 0;
      document.getElementById('score').innerText = score;
      document.getElementById('win-message').style.display = 'none';
      
      const board = document.getElementById('game-board');
      board.innerHTML = '';

      const englishCards = shuffle([...vocabulary]).map(item => ({ text: item.en, key: item.en, type: 'en' }));
      const turkishCards = shuffle([...vocabulary]).map(item => ({ text: item.tr, key: item.en, type: 'tr' }));

      // İki sütun oluşturmak için kartları harmanlıyoruz
      const allCards = [...englishCards, ...turkishCards];

      allCards.forEach(cardData => {
        const cardElem = document.createElement('div');
        cardElem.classList.add('card');
        cardElem.innerText = cardData.text;
        cardElem.dataset.key = cardData.key;
        cardElem.dataset.type = cardData.type;

        cardElem.addEventListener('click', () => handleSelect(cardElem));
        board.appendChild(cardElem);
      });
    }

    function handleSelect(card) {
      if (card.classList.contains('matched')) return;

      const type = card.dataset.type;

      if (type === 'en') {
        if (selectedEnglish) selectedEnglish.classList.remove('selected');
        selectedEnglish = card;
        selectedEnglish.classList.add('selected');
      } else {
        if (selectedTurkish) selectedTurkish.classList.remove('selected');
        selectedTurkish = card;
        selectedTurkish.classList.add('selected');
      }

      if (selectedEnglish && selectedTurkish) {
        checkMatch();
      }
    }

    function checkMatch() {
      if (selectedEnglish.dataset.key === selectedTurkish.dataset.key) {
        selectedEnglish.classList.remove('selected');
        selectedTurkish.classList.remove('selected');
        
        selectedEnglish.classList.add('matched');
        selectedTurkish.classList.add('matched');

        score++;
        document.getElementById('score').innerText = score;

        selectedEnglish = null;
        selectedTurkish = null;

        if (score === vocabulary.length) {
          document.getElementById('win-message').style.display = 'block';
        }
      } else {
        setTimeout(() => {
          if (selectedEnglish) selectedEnglish.classList.remove('selected');
          if (selectedTurkish) selectedTurkish.classList.remove('selected');
          selectedEnglish = null;
          selectedTurkish = null;
        }, 400);
      }
    }

    initGame();
  </script>
</body>
</html>
