 <!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRVGAMES - Uçak Simülatörü</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000;
            user-select: none;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
        }

        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #00ff66;
            font-family: monospace;
            font-size: 16px;
            text-shadow: 0 0 5px rgba(0, 255, 102, 0.7);
            background: rgba(0, 20, 0, 0.6);
            padding: 15px;
            border: 1px solid #00ff66;
            border-radius: 8px;
            pointer-events: none;
        }

        #controls-info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #fff;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.6;
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            border: 2px solid rgba(0, 255, 102, 0.5);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            font-weight: bold;
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

    <div id="canvas-container"></div>
    <div id="crosshair"></div>
    <div id="loading">CRVGAMES Uçak Modeli Yükleniyor...</div>

    <div id="hud">
        <b>CRVGAMES FLIGHT HUD</b><br>
        --------------------<br>
        HIZ (SPD): <span id="speed-val">0</span> km/h<br>
        İRTİFA (ALT): <span id="alt-val">0</span> m<br>
        MOTOR (THROTTLE): %<span id="throttle-val">0</span><br>
        DURUM: <span id="status-val" style="color:#00ff66;">NORMAL</span>
    </div>

    <div id="controls-info">
        <b>KONTROLLER:</b><br>
        <b>W / S</b> : Burun Aşağı / Yukarı (Pitch)<br>
        <b>A / D</b> : Sola / Sağa Yatış (Roll)<br>
        <b>Q / E</b> : Dikey Dümen (Yaw)<br>
        <b>SHIFT / CTRL</b> : Gaz Arttır / Azalt (Throttle)
    </div>

    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        scene.fog = new THREE.FogExp2(0x87ceeb, 0.0002);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 100000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(2000, 4000, 2000);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // Zemin ve Izgara
        const gridHelper = new THREE.GridHelper(50000, 200, 0x004400, 0x228822);
        gridHelper.position.y = 0;
        scene.add(gridHelper);

        let airplane = new THREE.Group();
        scene.add(airplane);

        let physics = {
            speed: 0,
            maxSpeed: 800,
            throttle: 50, // Başlangıçta %50 gaz verelim ki doğrudan hareket etmeye başlasın
            pitch: 0,
            roll: 0,
            yaw: 0,
            altitude: 0
        };

        const keys = {};

        window.addEventListener('keydown', (e) => { keys[e.key.toLowerCase()] = true; });
        window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

        const loader = new THREE.GLTFLoader();
        loader.load('airplane.gltf', (gltf) => {
            const model = gltf.scene;

            // MODEL BOYUTUNU BÜYÜTÜYORUZ (İhtiyaca göre 50 rakamını değiştirebilirsiniz)
            model.scale.set(50, 50, 50);

            // Modellerin yönü farklılık gösterebilir, 180 derece döndürerek öne bakmasını sağlıyoruz
            model.rotation.y = Math.PI;

            model.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                }
            });

            airplane.add(model);
            airplane.position.set(0, 500, 0); // Başlangıç yüksekliğini artırdık
            document.getElementById('loading').style.display = 'none';
        }, undefined, (error) => {
            console.error(error);
            document.getElementById('loading').innerText = 'Model dosyası yüklenemedi!';
        });

        function updatePhysics() {
            // Gaz Kontrolü (Shift & Control)
            if (keys['shift']) physics.throttle = Math.min(100, physics.throttle + 0.5);
            if (keys['control']) physics.throttle = Math.max(0, physics.throttle - 0.5);

            // Hızlanma Hesabı
            const targetSpeed = (physics.throttle / 100) * physics.maxSpeed;
            physics.speed += (targetSpeed - physics.speed) * 0.05;

            // Direksiyon / Manevra Duyarlılığı
            if (keys['w']) physics.pitch = THREE.MathUtils.lerp(physics.pitch, -0.02, 0.1);
            else if (keys['s']) physics.pitch = THREE.MathUtils.lerp(physics.pitch, 0.02, 0.1);
            else physics.pitch = THREE.MathUtils.lerp(physics.pitch, 0, 0.1);

            if (keys['a']) physics.roll = THREE.MathUtils.lerp(physics.roll, 0.04, 0.1);
            else if (keys['d']) physics.roll = THREE.MathUtils.lerp(physics.roll, -0.04, 0.1);
            else physics.roll = THREE.MathUtils.lerp(physics.roll, 0, 0.1);

            if (keys['q']) physics.yaw = THREE.MathUtils.lerp(physics.yaw, 0.015, 0.1);
            else if (keys['e']) physics.yaw = THREE.MathUtils.lerp(physics.yaw, -0.015, 0.1);
            else physics.yaw = THREE.MathUtils.lerp(physics.yaw, 0, 0.1);

            // Rotasyonları Uçağa Uygula
            airplane.rotateX(physics.pitch);
            airplane.rotateZ(physics.roll);
            airplane.rotateY(physics.yaw);

            // Uçağı Baktığı Yöne Doğru İlerlet
            airplane.translateZ(physics.speed * 0.2);

            // Yere Temas Kontrolü
            if (airplane.position.y < 10) {
                airplane.position.y = 10;
                document.getElementById('status-val').innerText = 'ZEMİNDE';
                document.getElementById('status-val').style.color = 'yellow';
            } else {
                document.getElementById('status-val').innerText = 'UÇUŞTA';
                document.getElementById('status-val').style.color = '#00ff66';
            }

            physics.altitude = Math.round(airplane.position.y);
        }

        function updateCamera() {
            // Kameranın Uçaktan Uzaklığı (Büyütülen modele göre mesafe artırıldı)
            const offset = new THREE.Vector3(0, 40, -150);
            offset.applyQuaternion(airplane.quaternion);
            
            const targetCamPos = airplane.position.clone().add(offset);
            camera.position.lerp(targetCamPos, 0.1);
            
            const lookTarget = airplane.position.clone().add(new THREE.Vector3(0, 10, 100).applyQuaternion(airplane.quaternion));
            camera.lookAt(lookTarget);
        }

        function updateHUD() {
            document.getElementById('speed-val').innerText = Math.round(physics.speed);
            document.getElementById('alt-val').innerText = physics.altitude;
            document.getElementById('throttle-val').innerText = Math.round(physics.throttle);
        }

        function animate() {
            requestAnimationFrame(animate);

            updatePhysics();
            updateCamera();
            updateHUD();

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
